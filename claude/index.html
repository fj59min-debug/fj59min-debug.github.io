<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude チャット</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --muted:#6b6a68; --card:#fff; --line:#e4e1d8; --accent:#c96442; --user:#efe9dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#262624; --fg:#eeece6; --muted:#a09d96; --card:#30302e; --line:#444441; --accent:#d97757; --user:#3a3835; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0 auto 0 0; }
  header h1 span { color:var(--accent); }
  select, input, textarea, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #settings { display:none; padding:12px 16px; border-bottom:1px solid var(--line); gap:8px; flex-direction:column; }
  #settings.open { display:flex; }
  #settings label { font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  #settings .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:16px; }
  .msg { max-width:760px; margin:0 auto 16px; padding:10px 14px; border-radius:12px; word-break:break-word; }
  .msg.user { background:var(--user); white-space:pre-wrap; }
  .msg.assistant { background:transparent; }
  .msg.error { background:#fdecea; color:#8a1c12; border:1px solid #f3b8b1; }
  .msg p { margin:.4em 0; }
  .msg pre { background:#1e1e1e; color:#eee; padding:10px 12px; border-radius:8px; overflow-x:auto; font-size:14px; }
  .msg code { font-family:ui-monospace,Menlo,Consolas,monospace; background:rgba(127,127,127,.18); padding:1px 5px; border-radius:4px; font-size:.92em; }
  .msg pre code { background:none; padding:0; }
  .empty { max-width:760px; margin:10vh auto; text-align:center; color:var(--muted); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:792px; width:100%; margin:0 auto; }
  form textarea { flex:1; resize:none; min-height:44px; max-height:200px; }
</style>
</head>
<body>
<header>
  <h1><span>✻</span> Claude チャット</h1>
  <select id="model" aria-label="モデル">
    <option value="claude-opus-5-5">Claude Opus 5.5</option>
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
    <option value="claude-haiku-5-5">Claude Haiku 5.5</option>
  </select>
  <button id="toggle">設定</button>
  <button id="clear">新しい会話</button>
</header>

<section id="settings">
  <label>Anthropic APIキー（sk-ant-...）
    <input id="key" type="password" autocomplete="off" placeholder="sk-ant-...">
  </label>
  <div class="row"><input id="remember" type="checkbox"><label for="remember" style="flex-direction:row">このブラウザにキーを保存する（共有PCでは非推奨）</label></div>
  <label>システムプロンプト（任意）
    <textarea id="system" rows="2" placeholder="例: あなたは親切な日本語のアシスタントです。"></textarea>
  </label>
  <div class="row">キーはあなたのブラウザから api.anthropic.com に直接送られ、このページのサーバーには送信されません。APIの利用料金はあなたのアカウントにかかります。</div>
</section>

<main id="log" aria-live="polite"></main>

<form id="form">
  <textarea id="input" rows="1" placeholder="メッセージを入力（Enterで送信 / Shift+Enterで改行）"></textarea>
  <button id="send" class="primary" type="submit">送信</button>
  <button id="stop" type="button" hidden>停止</button>
</form>

<script>
"use strict";
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), keyEl = $("key");
let history = [];          // {role, content:string}
let controller = null;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

keyEl.value = store.get("claude_key") || "";
$("remember").checked = !!keyEl.value;
$("system").value = store.get("claude_system") || "";
$("model").value = store.get("claude_model") || "claude-opus-5-5";
if (!keyEl.value) $("settings").classList.add("open");

$("toggle").onclick = () => $("settings").classList.toggle("open");
$("model").onchange = e => store.set("claude_model", e.target.value);
$("system").onchange = e => store.set("claude_system", e.target.value);
$("remember").onchange = persistKey;
keyEl.onchange = persistKey;
function persistKey() {
  if ($("remember").checked && keyEl.value) store.set("claude_key", keyEl.value);
  else store.del("claude_key");
}
$("clear").onclick = () => { if (controller) controller.abort(); history = []; render(); };

// --- tiny, safe markdown: escape first, then code blocks / inline code / bold / paragraphs ---
function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function md(text) {
  const parts = text.split(/```/);
  return parts.map((p, i) => {
    if (i % 2 === 1) return "<pre><code>" + esc(p.replace(/^[^\n]*\n/, "")) + "</code></pre>";
    return esc(p).split(/\n{2,}/).map(par =>
      "<p>" + par.replace(/`([^`\n]+)`/g, "<code>$1</code>")
                 .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
                 .replace(/\n/g, "<br>") + "</p>").join("");
  }).join("");
}

function render() {
  log.innerHTML = "";
  if (!history.length) {
    log.innerHTML = '<div class="empty"><p>何でも聞いてください。</p><p>まず「設定」でAPIキーを入力します。</p></div>';
    return;
  }
  for (const m of history) addMsg(m.role, m.content);
}
function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  if (role === "assistant") d.innerHTML = md(text); else d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function send(text) {
  const apiKey = keyEl.value.trim();
  if (!apiKey) { $("settings").classList.add("open"); keyEl.focus(); return; }
  history.push({ role: "user", content: text });
  if (history.length === 1) log.innerHTML = "";
  addMsg("user", text);
  const out = addMsg("assistant", "…");
  let acc = "";
  controller = new AbortController();
  setBusy(true);
  try {
    const body = {
      model: $("model").value,
      max_tokens: 16000,
      stream: true,
      messages: history,
    };
    const sys = $("system").value.trim();
    if (sys) body.system = sys;

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      signal: controller.signal,
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      let msg = res.status + " " + res.statusText;
      try { msg = (await res.json()).error.message || msg; } catch {}
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "content_block_delta" && ev.delta.type === "text_delta") {
          acc += ev.delta.text;
          out.innerHTML = md(acc);
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === "error") {
          throw new Error(ev.error.message);
        } else if (ev.type === "message_delta" && ev.delta.stop_reason === "refusal") {
          acc += "\n\n（安全上の理由で応答が停止されました）";
          out.innerHTML = md(acc);
        }
      }
    }
    history.push({ role: "assistant", content: acc || "（空の応答）" });
  } catch (e) {
    if (e.name === "AbortError") {
      if (acc) history.push({ role: "assistant", content: acc }); else history.pop();
      if (!acc) out.remove();
    } else {
      history.pop();
      out.className = "msg error";
      out.textContent = "エラー: " + e.message;
    }
  } finally {
    controller = null;
    setBusy(false);
  }
}

function setBusy(b) {
  $("send").hidden = b; $("stop").hidden = !b; input.disabled = b;
  if (!b) input.focus();
}
$("stop").onclick = () => controller && controller.abort();
$("form").onsubmit = e => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t) return;
  input.value = ""; input.style.height = "";
  send(t);
};
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; });
render();
</script>
</body>
</html>

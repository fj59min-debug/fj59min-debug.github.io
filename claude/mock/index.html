<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 風チャット（オフライン版）</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --muted:#6b6a68; --card:#fff; --line:#e4e1d8; --accent:#c96442; --user:#efe9dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#262624; --fg:#eeece6; --muted:#a09d96; --card:#30302e; --line:#444441; --accent:#d97757; --user:#3a3835; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header h1 { font-size:18px; margin:0 auto 0 0; } header h1 span { color:var(--accent); }
  .badge { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:1px 10px; }
  button, input { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 12px; }
  button { cursor:pointer; } button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #log { flex:1; overflow-y:auto; padding:16px; }
  .msg { max-width:760px; margin:0 auto 14px; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { background:var(--user); }
  .chips { max-width:760px; margin:0 auto 14px; display:flex; flex-wrap:wrap; gap:6px; }
  .chips button { font-size:14px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:792px; width:100%; margin:0 auto; }
  form input { flex:1; }
</style>
</head>
<body>
<header>
  <h1><span>✻</span> Claude 風チャット</h1>
  <span class="badge">オフライン・API不使用</span>
  <button id="reset">リセット</button>
</header>
<main id="log" aria-live="polite"></main>
<form id="form">
  <input id="input" autocomplete="off" placeholder="メッセージを入力">
  <button class="primary" type="submit">送信</button>
</form>

<script>
"use strict";
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input");
const mem = { name: null, turns: 0 };
let typing = false;

const pick = a => a[Math.floor(Math.random() * a.length)];
const pad = n => String(n).padStart(2, "0");

// 安全な四則演算（eval/Function は使わず、自前で再帰下降パース）
function calc(src) {
  const s = src.replace(/[×x＊*]/g, "*").replace(/[÷／/]/g, "/").replace(/[＋+]/g, "+").replace(/[－ー−-]/g, "-")
               .replace(/[（]/g, "(").replace(/[）]/g, ")").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
               .replace(/\s+/g, "");
  if (!/^[0-9.+\-*/()]+$/.test(s)) return null;
  let i = 0;
  const peek = () => s[i];
  function expr() { let v = term(); while (peek() === "+" || peek() === "-") { const o = s[i++]; const r = term(); v = o === "+" ? v + r : v - r; } return v; }
  function term() { let v = factor(); while (peek() === "*" || peek() === "/") { const o = s[i++]; const r = factor(); v = o === "*" ? v * r : v / r; } return v; }
  function factor() {
    if (peek() === "-") { i++; return -factor(); }
    if (peek() === "(") { i++; const v = expr(); if (s[i++] !== ")") throw 0; return v; }
    const m = /^[0-9]+(\.[0-9]+)?/.exec(s.slice(i));
    if (!m) throw 0;
    i += m[0].length; return parseFloat(m[0]);
  }
  try { const v = expr(); return i === s.length && isFinite(v) ? v : null; } catch { return null; }
}

// 返答ルール（上から順に最初にマッチしたもの）
const rules = [
  [/(私|僕|俺|わたし)の名前は?[?？]$|名前.*(覚えて|わかる)/, () => mem.name ? `${mem.name}さん、ですよね。` : "まだ教えてもらっていません。教えてもらえますか？"],
  [/(私|僕|俺|わたし|ぼく).*(名前は|の名前は|です$)|^(名前は|なまえは)/, t => {
    const m = /([^\sは、。]{1,12})(です|だよ|といいます|と申します)/.exec(t) || /名前は([^\sです、。]{1,12})/.exec(t);
    if (m) { mem.name = m[1]; return `${mem.name}さん、はじめまして。覚えておきますね。今日は何をお手伝いしましょうか？`; }
    return "お名前を教えてください。「名前はタロウです」のように書いてもらえると覚えられます。";
  }],
  [/こんにちは|こんばんは|おはよう|はじめまして|やあ|hello|hi\b/i, () => pick(["こんにちは！今日はどんなご用件ですか？", "こんにちは。何でも気軽に話しかけてください。"]) ],
  [/ありがとう|感謝|助かった/, () => pick(["どういたしまして！", "お役に立てて嬉しいです。"])],
  [/あなた.*(誰|だれ|何者|なに)|自己紹介|君は誰/, () => "私はブラウザの中だけで動く、Claude 風のおしゃべりボットです。本物のClaudeではなく、決まったパターンに反応する簡易版で、AIモデルもAPIも使っていません。"],
  [/(何|なに)ができ|できること|使い方|ヘルプ|help/i, () => "できること:\n・時刻/日付 (「今何時？」)\n・計算 (「12*(3+4)は？」)\n・サイコロ/コイン (「サイコロ」「コイン投げて」)\n・おみくじ\n・名前を覚える\n・しりとりの代わりに豆知識 (「豆知識」)\nそれ以外は、聞き返したり相づちを打つだけです。"],
  [/何時|なんじ|時間|時刻/, () => { const d = new Date(); return `今は ${pad(d.getHours())}:${pad(d.getMinutes())} です。`; }],
  [/何日|なんにち|日付|今日|曜日/, () => { const d = new Date(); return `今日は ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}曜日）です。`; }],
  [/サイコロ|ダイス/, () => `🎲 ${1 + Math.floor(Math.random() * 6)} が出ました。`],
  [/コイン|コイントス/, () => `🪙 ${pick(["表", "裏"])}です。`],
  [/おみくじ|運勢/, () => `おみくじ: ${pick(["大吉", "中吉", "小吉", "吉", "末吉", "凶"])}`],
  [/豆知識|雑学/, () => pick([
    "ハチミツは正しく保存すれば腐りにくい食品として知られています。",
    "タコには心臓が3つあります。",
    "バナナは植物学上は「草」の果実です。",
    "富士山の標高は3,776メートルです。"])],
  [/疲れ|しんどい|つらい|眠い/, () => "それは大変でしたね。少し休憩できそうですか？よければ何があったか聞かせてください。"],
  [/嬉しい|楽しい|やった/, () => "それは素敵ですね！どんなことがあったのか、もう少し聞かせてください。"],
  [/さようなら|バイバイ|またね|おやすみ/, () => "また話しましょう。お疲れさまでした。"],
  [/^(.+)(って|とは)(何|なに)(ですか)?[?？]?$/, (t, m) => `「${m[1]}」についてですね。このオフライン版は辞書を持っていないので詳しくは答えられません。本物のClaude（claude.ai）なら詳しく説明してくれます。`],
];

function reply(text) {
  mem.turns++;
  const t = text.trim();
  // 計算式
  const mathy = /[0-9０-９]/.test(t) && /[+\-*/×÷＋－＊／()（）x]/.test(t);
  if (mathy) {
    const expr = t.replace(/(は|を|って|=|＝|？|\?|計算して|いくつ|答え|ですか|[。、])/g, "");
    const v = calc(expr);
    if (v !== null) return `${expr} = ${Math.round(v * 1e10) / 1e10}`;
  }
  for (const [re, fn] of rules) {
    const m = re.exec(t);
    if (m) return fn(t, m);
  }
  const q = /[?？]$|(ですか|ますか|かな|でしょうか)$/.test(t);
  if (q) return pick(["いい質問ですね。ただ、このオフライン版は決まったパターンにしか答えられません。「できること」と入力すると一覧が出ます。", "うまく答えられそうにありません。時刻・計算・サイコロなどなら得意です。"]);
  return pick([`なるほど、「${t.length > 24 ? t.slice(0, 24) + "…" : t}」ということですね。もう少し詳しく教えてもらえますか？`, "そうなんですね。それでどう思いましたか？", "ふむふむ。続きを聞かせてください。"]);
}

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
async function say(text) {
  typing = true;
  const d = add("assistant", "…");
  await new Promise(r => setTimeout(r, 350 + Math.random() * 350));
  d.textContent = "";
  for (const ch of text) {
    d.textContent += ch; log.scrollTop = log.scrollHeight;
    await new Promise(r => setTimeout(r, 18));
  }
  typing = false;
}
function chips() {
  const c = document.createElement("div"); c.className = "chips";
  for (const s of ["今何時？", "12*(3+4)は？", "サイコロ", "おみくじ", "豆知識", "できること"]) {
    const b = document.createElement("button"); b.textContent = s;
    b.onclick = () => submit(s); c.appendChild(b);
  }
  log.appendChild(c);
}
async function submit(text) {
  if (typing || !text.trim()) return;
  add("user", text);
  await say(reply(text));
}
function start() {
  log.innerHTML = ""; mem.name = null; mem.turns = 0;
  say("こんにちは。ブラウザの中だけで動く Claude 風ボットです（本物のAIではありません）。下のボタンを試すか、自由に話しかけてください。").then(chips);
}
$("form").onsubmit = e => { e.preventDefault(); const t = input.value; input.value = ""; submit(t); };
$("reset").onclick = () => { if (!typing) start(); };
start();
</script>
</body>
</html>
